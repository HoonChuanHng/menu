<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Management Login</title>
<link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">

<div class="page-wrapper">
    <div class="header-top">
    <h2 class="logo-title">
        Quick Plate Cafe
        <img src="/image/app-logo.png" alt="logo">
    </h2>
    </div>

    <div class="login-container">

    <div class="login-box">

        <h2>Login</h2>

        <select id="role">
        <option value="" disabled selected>Select Role</option>
        <option value="admin">Admin</option>
        <option value="kitchen">Kitchen</option>
        </select>

        <input id="username" placeholder="User ID">

        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="msg"></p>

    </div>

    </div>
</div>

<script>
function login() {
  const role = document.getElementById("role").value
  const username = document.getElementById("username").value
  const password = document.getElementById("password").value

if (
  role === "admin" &&
  (
    (username === "a1" && password === "123") ||
    (username === "a2" && password === "789")
  )
) {
  const session = {
    role: "admin",
    expiry: Date.now() + 15 * 60 * 1000
  }

  localStorage.setItem("session", JSON.stringify(session))
  window.location.href = "admin.html"
  return
}

if (
  role === "kitchen" &&
  (
    (username === "k1" && password === "123") ||
    (username === "k2" && password === "789")
  )
) {
  const session = {
    role: "kitchen",
    expiry: Date.now() + 15 * 60 * 1000
  }

  localStorage.setItem("session", JSON.stringify(session))
  window.location.href = "kitchen.html"
  return
}

  document.getElementById("msg").innerText = 
  "Incorrect username or password.\nPlease try again."
}

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    login()
  }
})

</script>

</body>
</html>
