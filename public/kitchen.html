<!DOCTYPE html>
<html>
<head>
  <title>Kitchen Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>


<body class="kitchen-body">

<h1 class="kitchen-title">Kitchen Orders</h1>

<div id="orders" class="kitchen-orders"></div>

<script>
async function loadOrders() {
  const res = await fetch("/api/dashboard")
  const data = await res.json()

  let html = ""

  data.activeOrders.forEach(o => {
    html += `
      <div class="order">
        <h3>Table ${o.tableId} | Order #${o.orderNumber}</h3>
        <p>Ordered at: ${new Date(o.time).toLocaleString()}</p>
        <p>Status: ${o.status}</p>

        <ul>
          ${o.items.map(i => `<li>${i.name} x ${i.qty}</li>`).join("")}
        </ul>

        <button onclick="update('${o.orderNumber}', 'PREPARING')">Preparing</button>
        <button onclick="update('${o.orderNumber}', 'DONE')">Done</button>
      </div>
    `
  })

  document.getElementById("orders").innerHTML = html
}

async function update(orderNumber, status) {
  await fetch("/api/status", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ orderNumber, status })
  })

  loadOrders()
}

loadOrders()
setInterval(loadOrders, 3000)
</script>

</body>
</html>
