<!DOCTYPE html>
<html>
<head>
  <title>Kitchen Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>


<body class="kitchen-body">

<script>
if (localStorage.getItem("role") !== "kitchen") {
window.location.href = "management.html"
}
</script>

<div class="kitchen-header">
  <h1 class="kitchen-title">Kitchen Orders</h1>

  <label class="switch">
    <input type="checkbox" id="darkToggle">
    <span class="slider"></span>
  </label>
</div>

<div id="orders" class="kitchen-orders"></div>

<script>
async function loadOrders() {
  const res = await fetch("/api/dashboard")
  const data = await res.json()

  let html = ""

  data.activeOrders.forEach(o => {
    html += `
      <div class="order">
        <h3>Table ${o.tableId} | Order #${o.orderNumber}</h3>
        <p>Ordered at: ${o.time}</p>
        <p>Status: <b>${o.status}</b></p>

        <ul>
          ${o.items.map(i => `<li>${i.name} x ${i.qty}</li>`).join("")}
        </ul>

        <button onclick="update(${Number(o.orderNumber)}, 'PREPARING')">Preparing</button>
        <button onclick="update(${Number(o.orderNumber)}, 'DONE')">Done</button>
        <button class="delete-btn" onclick="deleteOrder(${Number(o.orderNumber)})">Delete</button>
      </div>
    `
  })

  document.getElementById("orders").innerHTML = html
}

async function update(orderNumber, status) {
  await fetch("/api/status", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ orderNumber, status })
  })

  loadOrders()
}

async function deleteOrder(orderNumber) {
  await fetch("/api/order/" + Number(orderNumber), {
    method: "DELETE"
  })

  loadOrders()
}

loadOrders()
setInterval(loadOrders, 3000)

const toggle = document.getElementById("darkToggle")

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark")
  toggle.checked = true
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark")
  localStorage.setItem("dark", document.body.classList.contains("dark"))
})
</script>

</body>
</html>
