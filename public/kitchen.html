<!DOCTYPE html>
<html>
<head>
  <title>Kitchen Dashboard</title>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px }
    .order { background:#222; padding:15px; margin-bottom:10px; border-radius:10px }
    button { margin-right:5px; padding:5px 10px }
  </style>
</head>
<body>

<h1> Kitchen Orders</h1>
<div id="orders"></div>

<script>
async function loadOrders() {
  const res = await fetch("/api/dashboard")
  const data = await res.json()

  let html = ""

  data.activeOrders.forEach(o => {
    html += `
      <div class="order">
        <h3>Table ${o.tableId} | Order #${o.id}</h3>
        <p>Status: ${o.status}</p>
        <ul>
          ${o.items.map(i => `<li>${i.name} x ${i.qty}</li>`).join("")}
        </ul>

        <button onclick="update(${o.id}, 'PREPARING')">Preparing</button>
        <button onclick="update(${o.id}, 'DONE')">Done</button>
      </div>
    `
  })

  document.getElementById("orders").innerHTML = html
}

async function update(id, status) {
  await fetch("/api/status", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({id, status})
  })

  loadOrders()
}

loadOrders()
setInterval(loadOrders, 3000)
</script>

</body>
</html>
