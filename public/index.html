<!DOCTYPE html>
<html>
<head>
  <title>Quick Plate Cafe (GIT TEST)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<header style="background: linear-gradient(90deg, #ff6b6b, #4ecdc4); padding: 15px;">

  <h1>🍽️ Quick Plate Cafe</h1>

  <div style="background:black;color:white;padding:5px 10px;display:inline-block;margin-top:10px;border-radius:6px;">
    🚀 GIT TEST MODE ACTIVE
  </div>

  <div class="top-right">
    <label class="switch">
      <input type="checkbox" id="darkToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div style="position:absolute; top:10px; right:70px;">
    <button id="installBtn" style="display:none;">
      ⬇ Install App
    </button>
  </div>
</header>

<div style="text-align:center; padding:10px; background:#fff3cd;">
  ⚠ This is a test change to verify Git push is working
</div>

<main class="container">

  <section class="panel">
    <h2>Menu 🍔 UPDATED</h2>
    <div id="menu"></div>
  </section>

  <section class="panel">
    <h2>Cart 🛒</h2>
    <div id="cart"></div>
    <button class="order-btn" onclick="placeOrder()">Place Order</button>
  </section>

</main>

<script src="script.js"></script>
<script src="app.js"></script>

</body>
</html>
