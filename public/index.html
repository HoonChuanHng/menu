<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Plate Cafe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
</head>

<body>

  <header class="header">

    <div class="header-top">

      <h1 class="logo-title">
        Quick Plate Cafe
        <img src="/external/image/app-logo.png" alt="logo">
      </h1>

      <div class="header-right">
        <button id="installBtn">Install</button>

        <label class="switch">
          <input type="checkbox" id="darkToggle">
          <span class="slider"></span>
        </label>
      </div>

    </div>

    <div class="category-bar" id="categoryBar"></div>

  </header>

  <main>

    <section class="restaurant-info">
      <h2>Restaurant Info</h2>
      <p>Opening Hours: 9:00 AM – 9:00 PM</p>
      <p>Location: Jalan Sungai Besi</p>
      <p>Contact: 012-345 6789</p>
    </section>

    <div class="top-bar">
      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Search food..." onkeyup="filterMenu()">
      </div>
      <button id="notifyBtn" onclick="callWaiter()">Call Waiter</button>
      <button class="track-btn" onclick="trackOrder()">Track Order</button>
    </div>
    <section id="menu" class="menu-container"></section>

  </main>

  <button id="cartButton" class="cart-button" onclick="toggleCart()">
    View Cart (0)
  </button>

  <div id="cartModal" class="cart-modal">

    <div class="cart-content">

      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>

      <div id="cartItems"></div>
      <textarea id="orderRemarks" placeholder="Add remarks" class="remarks-box"></textarea>
      <div class="cart-footer">
        <h3 id="cartTotal">Total: RM0</h3>
        <button class="checkout-btn" onclick="placeOrder()">
          Place Order
        </button>
      </div>

    </div>

  </div>

  <script src="/js/menu.js"></script>
  <script src="/js/app.js"></script>
  
</body>
</html>
