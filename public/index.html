<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Plate Cafe</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
</head>

<body>

  <header class="header">

    <div class="header-top">
      <h1>🍽️ Quick Plate Cafe</h1>

      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="category-bar" id="categoryBar"></div>

  </header>

  <main>

    <section id="menu" class="menu-container"></section>

  </main>

  <button id="cartButton" class="cart-button" onclick="toggleCart()">
    View Cart (0)
  </button>

  <div id="cartModal" class="cart-modal">

    <div class="cart-content">

      <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>

      <div id="cartItems"></div>

      <div class="cart-footer">
        <h3 id="cartTotal">Total: RM0</h3>
        <button class="checkout-btn" onclick="placeOrder()">
          Place Order
        </button>
      </div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script src="app.js"></script>

</body>
</html>
