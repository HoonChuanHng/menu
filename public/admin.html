<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

<h1 class="admin-title">🧾 Admin Dashboard</h1>

<h2 id="revenue" class="revenue"></h2>

<h2>📍 Table Earnings</h2>
<div id="tables" class="grid"></div>

<h2>🍽️ Food Sold</h2>
<div id="food" class="grid"></div>

<h2>📦 Orders</h2>
<div id="orders"></div>

<script>
async function load() {
  const res = await fetch("/api/admin")
  const data = await res.json()

  document.getElementById("revenue").innerText =
    "Total Revenue: RM " + data.revenue.toFixed(2)

  let t = ""
  for (let k in data.tableTotals) {
    t += `<div class="card">Table ${k} → RM ${data.tableTotals[k].toFixed(2)}</div>`
  }
  document.getElementById("tables").innerHTML = t

  let f = ""
  for (let k in data.foodCount) {
    f += `<div class="card">${k} → ${data.foodCount[k]} sold</div>`
  }
  document.getElementById("food").innerHTML = f

  let o = ""
  data.orders.forEach(order => {
    o += `
      <div class="card">
        <h3>Order #${order.orderNumber} (Table ${order.tableId})</h3>
        <p>Status: ${order.status}</p>

        ${order.items.map(i =>
          `<div>${i.name} x ${i.qty || 1}</div>`
        ).join("")}

        <button class="danger" onclick="delOrder('${order.orderNumber}')">
          Delete
        </button>
      </div>
    `
  })

  document.getElementById("orders").innerHTML = o
}

async function delOrder(id) {
  await fetch("/api/order/" + id, { method: "DELETE" })
  load()
}

load()
setInterval(load, 3000)
</script>

</body>
</html>
