<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-body">

  <div class="kitchen-header">

    <h1 class="admin-title"> Admin Dashboard 🛠️</h1>

    <div>

      <button class="logout-btn" onclick="logout()">Logout</button>

      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>

    </div>

  </div>

  <div class="navbar">
    <button onclick="showSection('dashboard')">Sales Statistics</button>
    <button onclick="showSection('ordersSection')">All Orders</button>
    <button onclick="showSection('addFoodBox')">Add Food</button>
    <button onclick="showSection('foodSection')">Edit Menu</button>
    <button onclick="showSection('usersSection')">User Management</button>
  </div>

  <section id="dashboard" class="section">

    <h2 id="revenue" class="revenue"></h2>
    <h2 class="kitchen-title">Sales Statistics</h2>

    <div id="chartBox">

      <div class="chart-controls">
        <button onclick="changeChart('barH')">Best Sellers</button>
        <button onclick="changeChart('pie')">Food Sold</button>
        <button onclick="changeChart('line')">Daily Sales</button>
      </div>

      <canvas id="foodChart"></canvas>

    </div>

  </section>

  <section id="ordersSection" class="section">

    <h2 class="kitchen-title">All Orders</h2>
  
    <div class="toolbar">
      <select id="orderSort" onchange="changeOrderSort()">
        <option value="orderId">By Order ID</option>
        <option value="date">By Date</option>
        <option value="totalPrice">By Total Price</option>
        <option value="table">By Table</option>
        <option value="status">By Status</option>
      </select>
    </div>

    <div id="orders"></div>

  </section>

  <section id="addFoodBox" class="section">

    <h2 class="kitchen-title"> Add Food</h2>

    <form id="add-food-form">
      <input id="name" placeholder="Food Name">
      <input id="price" type="number" placeholder="Price (RM)">
      <input type="file" id="imgFile">
      <input id="category" placeholder="Category">
      <button>Add Food</button>
    </form>

  </section>

  <section id="foodSection" class="section">

    <h2 class="kitchen-title">Food Details</h2>

    <div class="toolbar">
      <select id="sortFood" onchange="applyFoodSort()">
        <option value="default">Default</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="priceLow">Price Low → High</option>
        <option value="priceHigh">Price High → Low</option>
        <option value="category">Category (A → Z)</option>
      </select>
    </div>

    <div id="foodList" class="food-grid"></div>

    <div id="imgModal" class="img-modal">
      <img id="imgModalContent" src="">
    </div>
    
    <div id="editModal" class="modal">

      <div class="modal-box">

        <h3>Edit Food</h3>

        <input id="editName" type="text" placeholder="Name">
        <input id="editPrice" type="number" placeholder="Price">
        <input id="editCategory" type="text" placeholder="Category">
        <input id="editImg" type="file" accept="image/*">

        <div class="modal-actions">
          <button onclick="saveEdit()">Save</button>
          <button onclick="closeEdit()">Cancel</button>
        </div>

  </section>
  
  <section id="usersSection" class="section">

    <h2 class="user-management">User Management</h2>

    <form id="user-management-form">

      <div class="add-user-box">

        <input id="newUsername" placeholder="User ID">
        <input id="newPassword" type="password" placeholder="Password">

        <select id="newRole">
          <option value="" disabled selected>Select User</option>
          <option value="admin">Admin</option>
          <option value="kitchen">Kitchen</option>
          <option value="waiter">Waiter</option>
        </select>

        <button>Add User</button>

      </div>

    </form>

    <h2 class="user-list">User List</h2>

    <div id="users" class="user"></div>

  </section>

  <script src="/js/admin.js"></script>

</body>
</html>
