<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-body">

<div class="kitchen-header">
  <h1 class="admin-title">🧾 Admin Dashboard</h1>

  <label class="switch">
    <input type="checkbox" id="darkToggle">
    <span class="slider"></span>
  </label>
</div>

<h2 id="revenue" class="revenue"></h2>

<h2>💳 Checkout Tables</h2>
<div id="tables" class="grid"></div>

<h2>🍽️ Food Sold</h2>
<canvas id="foodChart"></canvas>

<h2>📦 Orders</h2>
<div id="orders"></div>

<script>

async function load() {
  const res = await fetch("/api/admin")
  const data = await res.json()

  document.getElementById("revenue").innerText =
    "Total Revenue: RM " + data.revenue.toFixed(2)

  let t = ""

  for (let k in data.tableTotals) {
    t += `
      <div class="card">
        <h3>Table ${k}</h3>
        <p>Total: RM ${data.tableTotals[k].toFixed(2)}</p>

        <button class="danger" onclick="checkoutTable('${k}')">
          Checkout
        </button>
      </div>
    `
  }

  document.getElementById("tables").innerHTML = t

  let labels = Object.keys(data.foodCount)
  let values = Object.values(data.foodCount)

  const ctx = document.getElementById("foodChart").getContext("2d")

  if (window.foodChartInstance) {
    window.foodChartInstance.destroy()
  }

  window.foodChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Food Sold",
        data: values
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  })

  let o = ""
  data.orders.forEach(order => {
    o += `
      <div class="card">
        <h3>Order #${order.orderNumber} (Table ${order.tableId})</h3>
        <p>Time: ${order.time}</p>
        <p>Status: ${order.status}</p>

        ${order.items.map(i =>
          `<div>${i.name} x ${i.qty || 1}</div>`
        ).join("")}

        <button class="danger" onclick="delOrder('${order.orderNumber}')">
          Delete
        </button>
      </div>
    `
  })

  document.getElementById("orders").innerHTML = o
}

async function delOrder(id) {
  await fetch("/api/order/" + id, { method: "DELETE" })
  load()
}

async function checkoutTable(tableId) {
  await fetch("/api/checkout/" + tableId, {
    method: "POST"
  })

  load()
}

/* DARK MODE */
const toggle = document.getElementById("darkToggle")

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark")
  toggle.checked = true
}

toggle.addEventListener("change", () => {
  document.body.classList.toggle("dark")
  localStorage.setItem("dark", document.body.classList.contains("dark"))
})

load()
setInterval(load, 3000)
</script>

</body>
</html>
